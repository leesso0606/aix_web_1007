<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="http://code.jquery.com/jquery-latest.min.js"></script> {# 제이쿼리#}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script> {# 차트js#}
<title>영화차트</title>
<link rel='stylesheet' href='/static/css/bview.css'>

</head>
<body>
<!-- HEADER -->
<header>
<div class="top">
<div class="logo">
            FOREST
        </div>
<ul class="menu">
<li><a href="#">소개</a></li>
<li><a href="#">뉴스</a></li>
<li><a href="#">학생관리</a></li>
<li><a href="#">학과정보</a></li>
<li><a href="#">문의</a></li>
</ul>
</div>
</header>
<!-- VISUAL -->
<section class="visual">
    <div>
        <h1>NEWS</h1>
        <p>포레스트의 새로운 소식을 만나보세요.</p>
    </div>
</section>

<main>

    <div class="container">
        <input type='text' name='search_word' id='search_word'>
        <button type='button' onclick='chartBtn()'>그래프 그리기</button>
        <br><br>
        <!-- 그래프 그려지는 태그-->
        <div>
            <canvas id="myChart"></canvas>
        </div>
    </div>

</main>
<script>
    function chartBtn(){
        title_list=[]
        crevenue_list=[]
        const search_word =$("#search_word").val();
        alert(search_word+' (으)로 검색을 시작합니다.');

        $.ajax({
            url:'/screen/chart_data/',
            type:'post',
            headers:{'X-CSRFToken':'{{csrf_token}}'},
            data:{'search_word':search_word},
            dataType:'json',
            success:function(data){
                alert('성공');
                console.log(data);
                data.list.forEach(function(s){
                    title_list.push(s.title)
                    crevenue_list.push(s.crevenue)
                });
                console.log('title_list:',title_list)
                console.log('crevenue_list:',crevenue_list)
                //기존차트가 그려져 있으면 리셋 후 진행
                let charts = Chart.getChart('myChart')
                if(charts != undefined){
                    charts.destroy()
                } 

                //그래프 그리기
                const ctx = document.getElementById('myChart');

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                    labels: title_list,  
                    datasets: [{
                        label: '영화별 매출액',
                        data: crevenue_list, 
                        borderWidth: 1,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.2)',
                            'rgba(54, 162, 235, 0.2)',
                            'rgba(255, 206, 86, 0.2)',
                            'rgba(75, 192, 192, 0.2)',
                            'rgba(153, 102, 255, 0.2)',
                            'rgba(255, 159, 64, 0.2)'
                            ]
                    }]
                    },
                    options: {
                    scales: {
                        y: {
                        beginAtZero: true
                        }
                    }
                    }
                });

                //-------------------------------
            },
            error:function(){
                alert('실패')
            }
        })//ajax
    }
</script>
