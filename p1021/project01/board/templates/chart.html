<!-- 차트그리기-->
<script>
    function chartBtn(){
        let search = $('#search').val();
        let word = $('#word').val();
        id_list=[]
        bhit_list=[]
        alert('차트를 생성합니다.');
        $.ajax({
            url:"/board/chart_data/",                   //보내는 링크주소
            type:'post',                                //전송방식
            headers:{'X-CSRFToken':'{{csrf_token}}'},   //csrt_token
            data:{'search':search, 'word':word},                                    // html에서 django보내는 데이터
            dataType:'json',                             // json, xml, text -> 받는 데이터 타입
            success:function(data){                     //성공시 전달데이터를 data변수 추가
                alert('성공')
                //console.log('data1:',data.data1);
                //console.log('data2:',data.data2);
                //console.log('list 전체:', data.list);
                //console.log('list[0].bno:',data.list[0].bno);

                //1번째 forEach문
                data.list.forEach(function(d){
                    id_list.push(d.id);  // 파이썬의 append가 자바에서는 push
                    bhit_list.push(d.bhit)
                }
                )
                console.log('id_list:',id_list);
                console.log('bhit_list:',bhit_list);

                let charts = Chart.getChart('myChart')
                if(charts != undefined){
                    charts.destroy()
                } // 버튼 다시 누르면 게시판 다시 만들어짐


                // 그래프 그리기
                const ctx = document.getElementById('myChart');

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                    labels: id_list,
                    datasets: [{
                        label: '게시판 조회수',
                        data: bhit_list,
                        borderWidth: 1
                    }]
                    },
                    options: {
                    scales: {
                        y: {
                        beginAtZero: true
                        }
                    }
                    }
                });


                //2번째 for문
                for(var i=0;i<data.list.length;i++){

                }
            },
            error:function(){ 
                alert('실패')
            }
        })//ajax
    } 
</script>

<main>

    <div class="container">
        <input type='text' name='word' id='word' placeholder='조회수를 입력하세요'><br>
        <input type='text' name='search' id='search' placeholder='검색어를 입력하세요'><br>

        <button type='button' onclick='chartBtn()'>그래프 그리기</button>
        <br><br>
        <!-- 그래프 그려지는 태그-->
        <div>
            <canvas id="myChart"></canvas>
