<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel='stylesheet' href='/static/css/mwrite.css'/>
  <script  src="http://code.jquery.com/jquery-latest.min.js"></script>
  <title>FOREST - 회원 수정페이지</title>
  
</head>
<body>
  <header>
    <div class="top">
      <div class="logo"><a href="#">FOREST</a></div>
      <nav aria-label="주 메뉴">
        <ul class="menu">
          <li><a href="#">소개</a></li>
          <li><a href="#">뉴스</a></li>
          <li><a href="#">학생관리</a></li>
          <li><a href="#">학과정보</a></li>
          <li><a href="#">문의</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="visual">
    <div>
      <h1>회원정보 수정</h1>
    </div>
  </section>
  <br>
    <form action="{%url 'member:mupdate' request.session.session_id %}" method='post' name='memberfrm' id="signup-form" class="form-box">
      {% csrf_token %}
      <table>
        <tbody>
          <tr>
            <td><label for="user-id">아이디</label></td>
            <td><div class="id-check-box">
              <input name='id' id="user-id" type="text"  value='{{member.id}}'>
            </div></td>
          </tr>
          <tr>
            <td><label for="password">비밀번호</label></td>
            <td><input name='pw' id="password" type="password" 
              ></td>
          </tr>
          <tr>
            <td><label for="password-confirm">비밀번호 확인</label></td>
            <td><input name='pw2' id="password-confirm" type="password" required></td>
          </tr>
          <tr>
            <td><label for="name">이름</label></td>
            <td><input name='name' id="name" type="text" value='{{member.name}}'></td>
          </tr>
          <tr>
            <td><label for="nickname">닉네임</label></td>
            <td><input  name='nickname' id="nickname" type="text" value='{{member.nickname}}' ></td>
          </tr>
          <tr>
            <td><label for="phone1">휴대전화</label></td>
            <td><div class="phone-input">
              <select name='tel1' id="phone1" aria-label="휴대전화 앞자리">
                <option
                {% if '010' in tel.0%}selected{%endif%}>010</option>
                <option
                {% if '02' in tel.0%}selected{%endif%}>02</option>
                <option
                {% if '016' in tel.0%}selected{%endif%}>016</option>
                <option
                {% if '017' in tel.0%}selected{%endif%}>017</option>
              </select>
              <span>-</span><input name='tel2' value='{{tel.1}}' type="text" aria-label="휴대전화 가운데 자리" maxlength="4" inputmode="numeric" required>
              <span>-</span><input name='tel3' value='{{tel.2}}' type="text" aria-label="휴대전화 끝자리" maxlength="4" inputmode="numeric" required>
            </div></td>
          </tr>
          <tr>
            <td>성별</td>
            <td>
              <div class="choice-group" role="group" aria-label="성별">
                <label><input type="radio" name="gender" value="남자" {% if '남자' in member.gender%}checked{%endif%}> 남자</label>
                <label><input type="radio" name="gender" value="여자" {% if '여자' in member.gender%}checked{%endif%}> 여자</label>
              </div>
            </td>
          </tr>
          <tr>
            <td>취미</td>
            <td>
              <div class="choice-group hobby-group" role="group" aria-label="취미">
                <label><input type="checkbox" name="hobby" value="게임" {% if '게임' in member.hobby%}checked{%endif%}> 게임</label>
                <label><input type="checkbox" name="hobby" value="골프" {% if '골프' in member.hobby%}checked{%endif%}> 골프</label>
                <label><input type="checkbox" name="hobby" value="수영" {% if '수영' in member.hobby%}checked{%endif%}> 수영</label>
                <label><input type="checkbox" name="hobby" value="조깅" {% if '조깅' in member.hobby%}checked{%endif%}> 조깅</label>
                <label><input type="checkbox" name="hobby" value="독서" {% if '독서' in member.hobby%}checked{%endif%}> 독서</label>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="btn-box">
        <button type="button" class="btn cancel" onclick="history.back()">취소</button>
        <button type="button" onclick="updateBtn()"  class="btn submit">수정</button>
      </div>
    </form>
  </main>

  <footer>Copyright © FOREST. All rights reserved.</footer>

  <script>
    function updateBtn(){
      //alert('확인');
      const pw=$('#password').val();
      const pw2=$('#password-confirm').val();
      console.log("pw,pw2:",+ pw,pw2);
      if(pw!=pw2){
        alert('비밀번호와 비밀번호 확인이 다릅니다. 다시 입력해주세요')
        return;
      }
      alert('{{request.session.session_id}}님 회원정보를 수정합니다')
      memberfrm.submit();
    }
  </script>
</body>
</html>
